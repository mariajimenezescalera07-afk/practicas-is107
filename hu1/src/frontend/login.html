<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · SG-CICT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina una-columna">
    <section class="panel">
      <h1>Inicia sesión</h1>
      <p class="intro">Accede a SG-CICT con tu correo y contraseña.</p>
      <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button class="boton" type="submit" id="btn">Iniciar sesión</button>
        <p class="enlace-pie">¿Aún no tienes cuenta? <a href="index.html">Solicita tu acceso</a></p>
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const $ = (id) => document.getElementById(id);
    const avisos = $("avisos");
    const aviso = (tipo, titulo, mensaje) => {
      avisos.replaceChildren();
      const c = document.createElement("div"); c.className = `aviso ${tipo}`;
      const h = document.createElement("h2"); h.textContent = titulo;
      const p = document.createElement("p"); p.textContent = mensaje;
      c.append(h, p); avisos.append(c);
    };

    // Aviso que llega desde el registro (usuario ya registrado)
    const params = new URLSearchParams(location.search);
    if (params.get("email")) $("email").value = params.get("email");
    if (params.get("aviso") === "ya_registrado") {
      aviso("info", "Ya tienes una cuenta", "Tu correo ya está registrado. Inicia sesión para continuar.");
    }

    const config = await fetch("/api/config/firebase-web").then((r) => r.json());
    const auth = getAuth(initializeApp(config));

    $("form-login").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("btn").disabled = true;
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
        aviso("exito", "Sesión iniciada", "Ya has accedido a la plataforma.");
        // window.location.assign("/inicio.html");   // aquí iría la pantalla principal
      } catch (e) {
        const mensajes = {
          "auth/user-disabled": ["aviso", "Solicitud en revisión", "Tu solicitud aún no ha sido aprobada. Te avisaremos cuando un administrador la revise."],
          "auth/invalid-credential": ["error", "Datos incorrectos", "El correo o la contraseña no son correctos."],
          "auth/too-many-requests": ["aviso", "Demasiados intentos", "Espera unos minutos antes de volver a probar."],
        };
        aviso(...(mensajes[e.code] || ["error", "No se pudo iniciar sesión", "Inténtalo de nuevo en unos minutos."]));
      } finally { $("btn").disabled = false; }
    });
  </script>
</body>
</html>
